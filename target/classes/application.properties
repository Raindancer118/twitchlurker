spring.application.name=twitchlurker
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=7d

lurker.data-dir=${LURKER_DATA_DIR:./data}
lurker.python-command=${LURKER_PYTHON:python3}
lurker.runner-script=${LURKER_RUNNER:./runner/lurker_runner.py}
lurker.allowed-emails=${LURKER_ALLOWED_EMAILS:}
lurker.allowed-groups=${LURKER_ALLOWED_GROUPS:}
lurker.zone=Europe/Berlin

spring.datasource.url=jdbc:sqlite:${lurker.data-dir}/twitchlurker.db
spring.datasource.hikari.maximum-pool-size=1
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.client.registration.authentik.client-id=${OIDC_CLIENT_ID:unset}
spring.security.oauth2.client.registration.authentik.client-secret=${OIDC_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.authentik.scope=openid,profile,email
spring.security.oauth2.client.registration.authentik.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.authentik.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.authentik.client-name=Authentik
spring.security.oauth2.client.registration.authentik.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Explicit endpoints instead of issuer-uri: no discovery call at startup, so the app boots even if Authentik is down.
oidc.base=${OIDC_BASE:https://portal.tstieh.de}
oidc.slug=${OIDC_SLUG:twitchlurker}
spring.security.oauth2.client.provider.authentik.authorization-uri=${oidc.base}/application/o/authorize/
spring.security.oauth2.client.provider.authentik.token-uri=${oidc.base}/application/o/token/
spring.security.oauth2.client.provider.authentik.user-info-uri=${oidc.base}/application/o/userinfo/
spring.security.oauth2.client.provider.authentik.jwk-set-uri=${oidc.base}/application/o/${oidc.slug}/jwks/
spring.security.oauth2.client.provider.authentik.user-name-attribute=preferred_username

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# saphira (NPMplus) terminates TLS; trust its X-Forwarded-* so redirect URIs use https and rate limits see the client IP.
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:37\\.27\\.247\\.15|127\\.0\\.0\\.1|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}}
lurker.dev-password=${LURKER_DEV_PASSWORD:}
lurker.twitch-id-base=${TWITCH_ID_BASE:https://id.twitch.tv}
