name: CI/CD

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements.txt
      - name: Runner dependencies
        run: |
          grep -v '^Twitch-Channel' runner/requirements.txt > /tmp/deps.txt
          pip install -r /tmp/deps.txt pytest pip-audit
          pip install --no-deps "$(grep '^Twitch-Channel' runner/requirements.txt)"
      - name: Python tests
        run: python -m pytest -q runner/tests
      - name: Python dependency audit
        run: pip-audit -r /tmp/deps.txt --progress-spinner off
      - name: Java tests (incl. startup test)
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: End-to-end tests against the real jar
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/shots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/twitchlurker-*.jar
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: glaedr
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.GLAEDR_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.GLAEDR_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Sync source (never touches .env or data)
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude '*.env' --exclude '.env.*' \
            --exclude '.git' --exclude 'data/' --exclude 'prototype/' --exclude 'e2e/' --exclude 'target/' \
            ./ oromis@92.5.78.34:/home/oromis/twitchlurker/
      - name: Build and restart on glaedr (arm64)
        run: |
          ssh oromis@92.5.78.34 'cd /home/oromis/twitchlurker && test -f .env && docker compose build --pull && docker compose up -d'
      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            status=$(ssh oromis@92.5.78.34 "docker inspect -f '{{.State.Health.Status}}' twitchlurker" || true)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then
              curl -fsS https://twitchlurker.raindancer118.de/actuator/health && exit 0
            fi
            sleep 6
          done
          ssh oromis@92.5.78.34 'docker logs --tail 80 twitchlurker'
          exit 1

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jar
      - uses: softprops/action-gh-release@v2
        with:
          files: twitchlurker-*.jar
          generate_release_notes: true
