services:
  twitchlurker:
    # Prebuilt multi-arch image (amd64 + arm64). `docker compose build` builds it from source instead.
    image: ghcr.io/raindancer118/twitchlurker:${LURKER_VERSION:-latest}
    build: .
    container_name: twitchlurker
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${LURKER_BIND:-127.0.0.1}:${LURKER_PORT:-8080}:8080"
    volumes:
      - lurker-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # sqlite-jdbc extracts and loads its native library from /tmp, so it must not be noexec
      - /tmp:exec,mode=1777
    mem_limit: 1g

volumes:
  lurker-data:
