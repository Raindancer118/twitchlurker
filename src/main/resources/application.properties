spring.application.name=twitchlurker
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=7d
# Reverse proxies whose X-Forwarded-* headers are trusted (regex). Default: loopback and private networks.
# Add your proxy's public IP if it reaches the app over the internet, otherwise OIDC redirect URIs come out as http.
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:127\\.0\\.0\\.1|::1|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}}

lurker.data-dir=${LURKER_DATA_DIR:./data}
lurker.python-command=${LURKER_PYTHON:python3}
lurker.runner-script=${LURKER_RUNNER:./runner/lurker_runner.py}
lurker.zone=${LURKER_TIMEZONE:Europe/Berlin}
lurker.twitch-id-base=${TWITCH_ID_BASE:https://id.twitch.tv}
lurker.community-drops-url=${LURKER_COMMUNITY_DROPS_URL:https://twitch-drops-api.sunkwi.com/drops}

# Login: "password" (default, one user) or "oidc" (any OpenID Connect provider)
lurker.auth.mode=${LURKER_AUTH_MODE:password}
lurker.auth.username=${LURKER_USERNAME:admin}
lurker.auth.password=${LURKER_PASSWORD:}
lurker.oidc.issuer-uri=${OIDC_ISSUER_URI:}
lurker.oidc.client-id=${OIDC_CLIENT_ID:}
lurker.oidc.client-secret=${OIDC_CLIENT_SECRET:}
lurker.oidc.authorization-uri=${OIDC_AUTHORIZATION_URI:}
lurker.oidc.token-uri=${OIDC_TOKEN_URI:}
lurker.oidc.user-info-uri=${OIDC_USERINFO_URI:}
lurker.oidc.jwk-set-uri=${OIDC_JWKS_URI:}
lurker.oidc.groups-claim=${OIDC_GROUPS_CLAIM:groups}
lurker.allowed-emails=${LURKER_ALLOWED_EMAILS:}
lurker.allowed-groups=${LURKER_ALLOWED_GROUPS:}

spring.datasource.url=jdbc:sqlite:${lurker.data-dir}/twitchlurker.db
spring.datasource.hikari.maximum-pool-size=1
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
